name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'api/**'
      - 'lib/**'
      - 'electron/**'
      - 'package.json'
      - 'package-lock.json'
      - 'icono.png'
      - '.github/workflows/windows-installer.yml'
  push:
    branches:
      - main
    paths:
      - 'electron/**'
      - 'package.json'
      - 'package-lock.json'
      - 'icono.png'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path api,lib,electron -Recurse -File -Filter *.js | ForEach-Object {
            Write-Host "Checking $($_.FullName)"
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test authentication and session security
        run: node --test tests/auth.test.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare application icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          New-Item -ItemType Directory -Force -Path electron | Out-Null
          Copy-Item icono.png electron/icono.png -Force
          magick icono.png -define icon:auto-resize=256,128,64,48,32,16 build/icon.ico

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Gestion-Electoral-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
